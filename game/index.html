<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERWARDEN — defend Ashwick's Beacon through seven nights</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="EMBERWARDEN: defend Ashwick's Beacon lantern through seven nights. Move with WASD, aim with the mouse, click to flare light at the Murk, Space to dash, E to light lamps, Q to pulse. Pick boons between nights."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
